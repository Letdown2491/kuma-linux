name: published

# Everything in ci.yml asks whether the tree works. This asks whether what
# is on the registry works, which is a different question with a different
# failure mode: it can go red without anyone having committed anything, so
# putting it in ci.yml would turn a registry hiccup into a red mark on
# somebody's pull request and teach people to ignore red.
#
# It is also the only check that installs an image kuma published rather
# than one it just built, which is what makes `kuma-home-subvol`
# verifiable: that converger only does anything on a btrfs root, only
# `kuma install` writes one, and until this existed nothing ever booted a
# disk it had written.
on:
  # TEMPORARY, REMOVE BEFORE MERGING. workflow_dispatch only works for a
  # file that is already on the default branch, so a new workflow cannot
  # be tried from the branch that adds it without this.
  push:
    branches:
      - ci-boot-probe
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to install and boot, and to upgrade to"
        required: false
        default: "ghcr.io/letdown2491/kuma:niri"
      from_image:
        description: "Older image the cross-version job installs first"
        required: false
        default: "ghcr.io/letdown2491/kuma:niri-0.7.0"
  schedule:
    # Weekly rather than daily. The daily heartbeat in ci.yml watches a
    # base that moves on its own; a published tag only moves when someone
    # publishes it, so the thing this guards against is rot in an artifact
    # that is already sitting still.
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  install-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - uses: ./.github/actions/kvm
        with:
          sshpass: "true"

      - name: install the published image and boot the disk it wrote
        env:
          QEMU_VGA: virtio-vga
          QEMU_DISPLAY: none
        run: |
          ./scripts/smoke.sh --published "${{ inputs.image || 'ghcr.io/letdown2491/kuma:niri' }}"

      - name: guest console
        if: failure()
        run: tail -200 vm-smoke/published/console.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-published
          path: vm-smoke/published/console.log
          if-no-files-found: warn

  # The only job that installs and boots an image built from this tree.
  #
  # That makes it the only place an unreleased change to install-time or
  # first-boot behaviour can be tested at all. The published jobs test an
  # artifact that by definition cannot contain it, and ci.yml's boot job
  # uses bootc-image-builder disks, which are ext4: every path that only
  # runs on a btrfs root does nothing there, so a broken converger and a
  # working one look identical.
  #
  # It is also where the ordering-cycle assertion runs. systemd resolves
  # a cycle by deleting a job, and on an ext4 disk the deleted job would
  # go unnoticed.
  fix-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - uses: ./.github/actions/kvm
        with:
          sshpass: "true"

      # --keep so the tag survives for the install below.
      - name: build this tree's niri image
        run: ./scripts/smoke.sh --keep niri

      - name: install the image this tree builds, and boot it
        env:
          QEMU_VGA: virtio-vga
          QEMU_DISPLAY: none
        run: ./scripts/smoke.sh --published localhost/kuma-smoke-niri:latest

      - name: guest console
        if: failure()
        run: tail -200 vm-smoke/published/console.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-fix-verification
          path: vm-smoke/published/console.log
          if-no-files-found: warn

  # 0.8's headline feature, booted for the first time.
  #
  # Encrypted installs were verified thoroughly and entirely offline: the
  # LUKS header, the passphrase, the kargs and the account file all read
  # through a loop device. What that cannot answer is the only question a
  # person has, which is whether the machine comes up when you type the
  # passphrase. Nothing had ever booted one, which made the headline
  # feature of 0.8 the one shipped thing with no boot coverage at all.
  #
  # Runs against the published image rather than a build: encryption is a
  # property of the install, not of the image, so this needs no compose
  # and adds no build time.
  encrypted-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: ./.github/actions/kvm
        with:
          sshpass: "true"

      - name: install an encrypted disk, then unlock it at the console
        env:
          QEMU_VGA: virtio-vga
          QEMU_DISPLAY: none
        run: |
          ./scripts/smoke.sh --encrypted \
            --published "${{ inputs.image || 'ghcr.io/letdown2491/kuma:niri' }}"

      - name: guest console
        if: failure()
        run: |
          tail -200 vm-smoke/published/console.log || true
          echo "=== what the unlocker saw ==="
          cat vm-smoke/published/unlock.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-encrypted
          path: |
            vm-smoke/published/console.log
            vm-smoke/published/unlock.log
          if-no-files-found: warn

  # Can a machine installed at one version reach a later one? Nothing has
  # ever asked. Every other check builds and boots a single image, so
  # "an existing machine survives moving forward" has been a promise
  # rather than a result, and it is the promise 1.0 rests on.
  #
  # Installs an older published tag while pointing its update origin at
  # the rolling one, so `bootc upgrade` inside the guest has somewhere
  # newer to go. Not `kuma update`: that is the builder's verb, which
  # pulls a base and rebuilds, and kuma's own update_check says a machine
  # running a published image asks bootc instead.
  cross-version:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - uses: ./.github/actions/kvm
        with:
          sshpass: "true"

      - name: install an old version, upgrade it, and boot what it became
        env:
          QEMU_VGA: virtio-vga
          QEMU_DISPLAY: none
        run: |
          ./scripts/smoke.sh \
            --published "${{ inputs.from_image || 'ghcr.io/letdown2491/kuma:niri-0.7.0' }}" \
            --upgrade-to "${{ inputs.image || 'ghcr.io/letdown2491/kuma:niri' }}"

      - name: guest console
        if: failure()
        run: tail -200 vm-smoke/published/console.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-cross-version
          path: vm-smoke/published/console.log
          if-no-files-found: warn
