name: boot-probe

# Throwaway. One question: can a kuma desktop guest bring up a greeter on a
# runner with no GPU, using virtio-vga without virgl and llvmpipe in the
# guest? Delete this file and its branch once it has answered.
on:
  push:
    branches:
      - ci-boot-probe

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - name: qemu and kvm access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 cryptsetup-bin >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm && echo "kvm writable"

      - name: boot niri without a host GPU
        env:
          QEMU_VGA: virtio-vga
          QEMU_DISPLAY: none
        run: ./scripts/smoke.sh --boot niri

      - name: the guest console, pass or fail
        if: always()
        run: |
          log=vm-smoke/niri/console.log
          if [ -f "$log" ]; then
            echo "=== last 120 lines ==="
            tail -120 "$log"
            echo "=== greeter / drm / gbm / mesa mentions ==="
            grep -iE 'greetd|niri|drm|gbm|mesa|llvmpipe|virtio_gpu|failed' "$log" \
                | tail -60 || echo "(none)"
          else
            echo "no console log at $log"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console
          path: vm-smoke/niri/console.log
          if-no-files-found: warn
