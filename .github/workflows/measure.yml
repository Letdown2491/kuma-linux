name: measure

# A one-shot experiment, not a gate. The image job builds only the
# headless `minimal` example, and that example names a base on purpose,
# so two paths have never executed in CI: the compose kuma does by
# default, and any desktop arm. Every build-time guard in those arms is
# therefore unproven on a push.
#
# ci.yml says a desktop image "does not fit a hosted runner's disk with
# room to spare". That was an assumption, never a measurement. This job
# measures it: reclaim what every runner carries and nobody here needs,
# then build the two cases in increasing cost, printing disk at each
# step. Both build steps continue on error, because a failure is a
# result and the numbers after it are the point.
#
# Delete this file once it has answered the question.

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: disk as the runner ships
        run: |
          df -h / /mnt || true
          echo "--- the big preinstalled trees ---"
          sudo du -shx /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift 2>/dev/null || true

      - name: reclaim
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af || true
          df -h / /mnt || true

      - run: cargo build --locked

      # The compose alone, headless. Cheapest case that exercises the
      # default path, and it isolates a compose failure from a size one.
      - name: composed headless
        continue-on-error: true
        run: |
          printf 'schema_version = 1\n[packages]\nrpm = ["fish"]\n' > /tmp/composed.toml
          ./target/debug/kuma build --config /tmp/composed.toml \
            --tag localhost/measure-composed:latest

      - name: disk after the compose
        if: always()
        run: |
          df -h / /mnt || true
          podman system df || true

      # Compose plus the whole niri arm: every RUN guard in the desktop
      # path, which is what this is really for.
      - name: niri desktop
        continue-on-error: true
        run: |
          ./target/debug/kuma build --config examples/niri.toml \
            --tag localhost/measure-niri:latest

      - name: disk after the desktop image
        if: always()
        run: |
          df -h / /mnt || true
          podman system df || true
          podman images || true
