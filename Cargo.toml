[package]
name = "kuma"
version = "0.11.0"
edition = "2021"
# Set by sha-crypt 0.6, the highest floor anything here asks for. Without
# it, an older toolchain fails somewhere inside a dependency instead of
# saying which version it wanted.
rust-version = "1.85"
description = "Declarative, atomic Fedora bootc system"
license = "MIT"
repository = "https://github.com/Letdown2491/kuma-linux"

# cargo-binstall fetches the release asset instead of compiling. Its
# default URL patterns expect the version in the filename, which kuma's
# assets deliberately omit, so the pattern is spelled out.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kuma-{ target }"
pkg-fmt = "bin"

# No `[profile.release] trim-paths`, and it is not an oversight: the
# feature is still unstable as of Cargo 1.97, and an unstable profile key
# is a hard manifest parse error rather than a warning, so adding it
# breaks every build on every toolchain that is not nightly. Tried, and it
# failed exactly that way.
#
# The problem it would have solved is real: rustc records source paths so
# panics can name a file, `kuma build` bakes the running binary into every
# image, and a binary built in someone's home carries that path forever.
# It is handled with `--remap-path-prefix` in RUSTFLAGS where the release
# artifacts are built, and enforced by scripts/publish-audit.sh, which
# fails on any home path it finds in a baked binary.

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
tempfile = "3"
clap_complete = "4"
rpassword = "7"
# getrandom: 0.6 stopped generating a salt for you, and the trait method
# that still does is behind this feature.
sha-crypt = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
schemars = { version = "1.2.2", features = ["derive"] }
