[package]
name = "kuma"
version = "0.4.0"
edition = "2021"
# Set by sha-crypt 0.6, the highest floor anything here asks for. Without
# it, an older toolchain fails somewhere inside a dependency instead of
# saying which version it wanted.
rust-version = "1.85"
description = "Declarative, atomic Fedora bootc system"
license = "MIT"
repository = "https://github.com/Letdown2491/kuma-linux"

# cargo-binstall fetches the release asset instead of compiling. Its
# default URL patterns expect the version in the filename, which kuma's
# assets deliberately omit, so the pattern is spelled out.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kuma-{ target }"
pkg-fmt = "bin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
tempfile = "3"
clap_complete = "4"
rpassword = "7"
# getrandom: 0.6 stopped generating a salt for you, and the trait method
# that still does is behind this feature.
sha-crypt = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
schemars = { version = "1.2.2", features = ["derive"] }
