[package]
name = "kuma"
version = "0.1.0"
edition = "2021"
description = "Declarative, atomic Fedora bootc system"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
rpassword = "7"
sha-crypt = "0.5"
