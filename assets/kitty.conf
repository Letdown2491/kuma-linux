# Kuma kitty theme: night navy, aurora accents.

# Named rather than left default: 11pt is what the unscaled 162-DPI panel
# wants, and a kitty default change shouldn't silently resize every
# terminal on the machine.
font_family      monospace
font_size        11.0

# kitty takes padding in CSS order, so these read as vertical then
# horizontal.
window_padding_width 10 12

# No titlebar: niri tiles and closes windows, so kitty's own decorations
# would just burn a row of pixels.
hide_window_decorations yes

# Opaque, and that is a decision the palette made. The terminal's
# background is now the shell's own surface colour, rendered from the
# live palette, so any translucency at all means it no longer equals the
# bar: at 0.96 the wallpaper showed through by 4 per cent, which is
# enough to see, and the error differed per window because it depends on
# what each one is sitting over. Measured against the bar's #121316, a
# window at 0.96 read #1a191b over bright wallpaper and #111317 over
# dark; at 1.0 it reads #121316 exactly.
background_opacity 1.0

background       #0e1626
foreground       #dce7f0

cursor           #7ee0a8
cursor_text_color #0e1626

selection_foreground #e8f2f8
selection_background #24354a

# normal
color0           #16202f
color1           #e06c75
color2           #7ee0a8
color3           #e8c47c
color4           #82aaff
color5           #c792ea
color6           #89ddff
color7           #d7e1ec

# bright
color8           #3b4c61
color9           #ef8a93
color10          #9df0c0
color11          #f2d69a
color12          #a3c2ff
color13          #d9b3f2
color14          #b0e8ff
color15          #f0f6fb
