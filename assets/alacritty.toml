# Kuma alacritty theme — night navy, aurora accents.

[window]
padding = { x = 12, y = 10 }
opacity = 0.96
# No titlebar — niri tiles and closes windows; a bar would just burn a row
# of pixels (and render in light Adwaita, clashing with the theme).
decorations = "None"

[colors.primary]
background = "#0e1626"
foreground = "#dce7f0"

[colors.cursor]
text = "#0e1626"
cursor = "#7ee0a8"

[colors.selection]
text = "#e8f2f8"
background = "#24354a"

[colors.normal]
black = "#16202f"
red = "#e06c75"
green = "#7ee0a8"
yellow = "#e8c47c"
blue = "#82aaff"
magenta = "#c792ea"
cyan = "#89ddff"
white = "#d7e1ec"

[colors.bright]
black = "#3b4c61"
red = "#ef8a93"
green = "#9df0c0"
yellow = "#f2d69a"
blue = "#a3c2ff"
magenta = "#d9b3f2"
cyan = "#b0e8ff"
white = "#f0f6fb"
