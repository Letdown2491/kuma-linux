# Kuma mako theme — night navy, aurora accents.
font=Noto Sans 11
background-color=#101a28f0
text-color=#dce7f0
border-color=#7ee0a866
border-size=1
border-radius=12
padding=12
margin=12
width=360
default-timeout=6000

[urgency=critical]
border-color=#e06c75
default-timeout=0

# Toggled by Mod+Shift+N; notifications queue silently until toggled back.
[mode=do-not-disturb]
invisible=1
