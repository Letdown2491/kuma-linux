# Kuma foot theme: night navy, aurora accents.

[main]
pad=12x10

[csd]
# No titlebar: niri tiles and closes windows; a bar would just burn a row
# of pixels (and render in light Adwaita, clashing with the theme).
preferred=none

[colors]
alpha=0.96
background=0e1626
foreground=dce7f0
selection-foreground=e8f2f8
selection-background=24354a
regular0=16202f
regular1=e06c75
regular2=7ee0a8
regular3=e8c47c
regular4=82aaff
regular5=c792ea
regular6=89ddff
regular7=d7e1ec
bright0=3b4c61
bright1=ef8a93
bright2=9df0c0
bright3=f2d69a
bright4=a3c2ff
bright5=d9b3f2
