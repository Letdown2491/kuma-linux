# Kuma's kitty surface, rendered by noctalia from the palette it is
# already showing. Replaces noctalia's own kitty template at
# /usr/share/noctalia/assets/templates/kitty/kitty.conf, and the
# replacement is the point.
#
# Upstream's template also renders color0-color15, and Material You maps
# every ANSI slot into the wallpaper's own hue family: measured against
# kuma's wallpaper, terminal_normal_green came out #afc8ee, which is
# blue. Every scheme noctalia offers does it (m3-tonal-spot #a4c9fe,
# m3-fruit-salad #4ed8e8, vibrant #5fafed, muted #dad3cd), so this is the
# mapping and not one unlucky image. A terminal whose green is blue
# reports a passing test as a failing one.
#
# So the palette supplies the surface and kuma keeps the sixteen. The
# ANSI colours stay in /etc/xdg/kitty/kitty.conf, which kitty loads
# beneath this file (kitty merges SYSTEM_CONF first, then the user's),
# and nothing here names them.

background            {{colors.terminal_background.default.hex}}
foreground            {{colors.terminal_foreground.default.hex}}

cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

selection_foreground  {{colors.on_surface.default.hex}}
selection_background  {{colors.surface_container_high.default.hex}}

active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.surface_variant.default.hex}}
url_color             {{colors.primary.default.hex}}

active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_variant.default.hex}}
